<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Slideshow</title>
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #161616;
    --border: #2a2a2a;
    --text: #ececec;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .card {
    background: var(--surface);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 640px;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    aspect-ratio: 4/3;
    object-fit: cover;
  }
  .body {
    padding: 18px 20px 20px;
    height: 150px;
    display: flex;
    flex-direction: column;
  }
  .response {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    overflow: hidden;
  }
  .footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .footer .info { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .footer .geo { font-variant-numeric: tabular-nums; }
  .footer .geo a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--border); }
  .footer .geo a:hover { color: var(--text); }
  .footer .sep[hidden] { display: none; }
  .footer .pos { font-variant-numeric: tabular-nums; }
  .empty {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .empty[hidden] { display: none; }
</style>
</head>
<body>
<div class="stage">
  <article class="card" id="card" hidden>
    <img id="img" alt="" />
    <div class="body">
      <div class="response" id="response"></div>
      <div class="footer">
        <span class="info">
          <span class="ts" id="ts"></span>
          <span class="sep" id="geo-sep" hidden> · </span>
          <span class="geo" id="geo"><a id="geo-link" target="_blank" rel="noopener"></a></span>
        </span>
        <span class="pos" id="pos"></span>
      </div>
    </div>
  </article>
</div>
<div class="empty" id="empty" hidden>No entries yet.</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = params.get("key") || "";

  var PAGE_SIZE = 50;
  var entries = [];
  var idx = 0;
  var loading = false;
  var exhausted = false;

  var initialIdx = Math.max(0, (parseInt(params.get("i"), 10) || 1) - 1);

  function syncUrl() {
    var p = new URLSearchParams(location.search);
    p.set("i", String(idx + 1));
    history.replaceState(null, "", location.pathname + "?" + p.toString());
  }

  var cardEl = document.getElementById("card");
  var imgEl = document.getElementById("img");
  var responseEl = document.getElementById("response");
  var tsEl = document.getElementById("ts");
  var geoEl = document.getElementById("geo");
  var geoSepEl = document.getElementById("geo-sep");
  var geoLinkEl = document.getElementById("geo-link");
  var posEl = document.getElementById("pos");
  var emptyEl = document.getElementById("empty");

  function imageUrl(e) {
    return "/gallery/image/" + encodeURIComponent(e.image_filename) +
      "?key=" + encodeURIComponent(key);
  }

  var dateFmt = new Intl.DateTimeFormat(undefined, {
    year: "numeric", month: "2-digit", day: "2-digit"
  });
  var timeFmt = new Intl.DateTimeFormat(undefined, {
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
  });
  function fmtTime(ms) {
    var d = new Date(ms);
    return dateFmt.format(d) + " · " + timeFmt.format(d);
  }

  function render() {
    var e = entries[idx];
    if (!e) return;
    cardEl.hidden = false;
    imgEl.src = imageUrl(e);
    responseEl.textContent = e.response_text || "";
    tsEl.textContent = fmtTime(e.created_at);
    if (typeof e.lat === "number" && typeof e.lng === "number") {
      var coords = e.lat.toFixed(5) + ", " + e.lng.toFixed(5);
      geoLinkEl.textContent = coords;
      geoLinkEl.href = "https://www.google.com/maps?q=" + e.lat + "," + e.lng;
      geoSepEl.hidden = false;
      geoEl.hidden = false;
    } else {
      geoLinkEl.textContent = "";
      geoLinkEl.removeAttribute("href");
      geoSepEl.hidden = true;
      geoEl.hidden = true;
    }
    var currentNum = String(idx + 1).padStart(5, "0");
    posEl.textContent = currentNum;
    document.title = "Slideshow – " + currentNum;
    syncUrl();
    preloadNeighbors();
  }

  function preloadNeighbors() {
    for (var i = idx - 2; i <= idx + 2; i++) {
      if (i === idx) continue;
      var e = entries[i];
      if (!e) continue;
      var im = new Image();
      im.src = imageUrl(e);
    }
  }

  function loadMore() {
    if (loading || exhausted) return Promise.resolve();
    loading = true;
    var url = "/gallery/api/entries?limit=" + PAGE_SIZE + "&key=" + encodeURIComponent(key);
    var oldest = entries.length ? entries[entries.length - 1].created_at : null;
    if (oldest != null) url += "&before=" + oldest;
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var page = data.entries || [];
        entries = entries.concat(page);
        if (page.length < PAGE_SIZE) exhausted = true;
      })
      .catch(function (err) { console.error(err); })
      .finally(function () { loading = false; });
  }

  function next() {
    if (idx < entries.length - 1) {
      idx++;
      render();
    } else if (!exhausted) {
      loadMore().then(function () {
        if (idx < entries.length - 1) { idx++; render(); }
      });
    }
  }

  function prev() {
    if (idx > 0) { idx--; render(); }
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });

  function loadUntil(target) {
    if (target < entries.length || exhausted) return Promise.resolve();
    return loadMore().then(function () {
      if (target < entries.length || exhausted) return;
      return loadUntil(target);
    });
  }

  loadUntil(initialIdx).then(function () {
    if (entries.length === 0) {
      emptyEl.hidden = false;
      return;
    }
    idx = Math.min(initialIdx, entries.length - 1);
    render();
  });
})();
</script>
</body>
</html>
