<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Gallery</title>
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #ececec;
    --muted: #8a8a8a;
    --accent: #bdbdbd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  main {
    width: 100%;
    margin: 0;
    padding: 16px 16px 40px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 1280px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1600px) {
    .grid { grid-template-columns: repeat(5, 1fr); }
  }
  .card {
    background: var(--surface);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    aspect-ratio: 4/3;
    object-fit: cover;
  }
  .body {
    padding: 18px 20px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .footer { margin-top: auto; }
  .response {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .ts {
    margin-top: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .geo {
    margin-top: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .geo a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--border); }
  .geo a:hover { color: var(--text); }
  .prompt {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }
  .bytes { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="grid" id="grid"></div>
  <div id="sentinel" style="height: 1px;"></div>
  <div class="empty" id="empty" hidden>No entries yet. Send an image to Claude to get started.</div>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = params.get("key") || "";

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var storageEl = null;
  var seen = new Set();

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
    return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
  }

  var dtFmt = new Intl.DateTimeFormat(undefined, {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
  });
  function fmtTime(ms) { return dtFmt.format(new Date(ms)); }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderCard(e) {
    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = e.id;
    var imgUrl = "/gallery/image/" + encodeURIComponent(e.image_filename) +
      "?key=" + encodeURIComponent(key);
    var geoHtml = "";
    if (typeof e.lat === "number" && typeof e.lng === "number") {
      var coords = e.lat.toFixed(5) + ", " + e.lng.toFixed(5);
      var href = "https://www.google.com/maps?q=" + e.lat + "," + e.lng;
      geoHtml = '<div class="geo"><a href="' + href + '" target="_blank" rel="noopener">' + esc(coords) + "</a></div>";
    }
    card.innerHTML =
      '<img loading="lazy" src="' + imgUrl + '" alt="" />' +
      '<div class="body">' +
        '<div class="response">' + esc(e.response_text) + "</div>" +
        '<div class="footer">' +
          '<div class="ts">' + esc(fmtTime(e.created_at)) + "</div>" +
          geoHtml +
        "</div>" +
      "</div>";
    return card;
  }

  function addEntry(e, prepend) {
    if (seen.has(e.id)) return;
    seen.add(e.id);
    var card = renderCard(e);
    if (prepend) {
      grid.insertBefore(card, grid.firstChild);
    } else {
      grid.appendChild(card);
    }
    updateEmpty();
  }

  function removeEntry(id) {
    var el = grid.querySelector('[data-id="' + id + '"]');
    if (el) el.remove();
    seen.delete(id);
    updateEmpty();
  }

  function updateEmpty() {
    empty.hidden = seen.size > 0;
  }

  function updateStorage(total, max) {
    document.title = "Gallery – " + fmtBytes(total) + " / " + fmtBytes(max);
  }

  function setStatus(s) {
    if (statusEl) statusEl.textContent = s;
  }

  var PAGE_SIZE = 50;
  var oldestLoaded = null;
  var loading = false;
  var exhausted = false;

  function loadPage() {
    if (loading || exhausted) return;
    loading = true;
    var url = "/gallery/api/entries?limit=" + PAGE_SIZE + "&key=" + encodeURIComponent(key);
    if (oldestLoaded != null) url += "&before=" + oldestLoaded;
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var entries = data.entries || [];
        entries.forEach(function (e) {
          addEntry(e, false);
          if (oldestLoaded == null || e.created_at < oldestLoaded) {
            oldestLoaded = e.created_at;
          }
        });
        updateStorage(data.total_bytes, data.max_bytes);
        if (entries.length < PAGE_SIZE) exhausted = true;
      })
      .catch(function (err) {
        setStatus("load failed");
        console.error(err);
      })
      .finally(function () {
        loading = false;
        maybeLoadMore();
      });
  }

  function maybeLoadMore() {
    if (loading || exhausted) return;
    var sentinel = document.getElementById("sentinel");
    if (!sentinel) return;
    var rect = sentinel.getBoundingClientRect();
    if (rect.top < (window.innerHeight || document.documentElement.clientHeight) + 400) {
      loadPage();
    }
  }

  function observeSentinel() {
    var sentinel = document.getElementById("sentinel");
    if (!sentinel) return;
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) loadPage();
        });
      }, { rootMargin: "400px 0px" });
      io.observe(sentinel);
    } else {
      window.addEventListener("scroll", maybeLoadMore, { passive: true });
      window.addEventListener("resize", maybeLoadMore);
    }
  }

  function connect() {
    var es = new EventSource("/gallery/events?key=" + encodeURIComponent(key));
    es.addEventListener("open", function () { setStatus("live"); });
    es.addEventListener("error", function () { setStatus("reconnecting"); });
    es.addEventListener("add", function (ev) {
      try {
        var data = JSON.parse(ev.data);
        addEntry(data.entry, true);
        updateStorage(data.total_bytes, data.max_bytes);
      } catch (e) { console.error(e); }
    });
    es.addEventListener("evict", function (ev) {
      try {
        var data = JSON.parse(ev.data);
        removeEntry(data.id);
        updateStorage(data.total_bytes, data.max_bytes);
      } catch (e) { console.error(e); }
    });
    es.addEventListener("ping", function () {});
  }

  observeSentinel();
  loadPage();
  connect();
})();
</script>
</body>
</html>
