<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<title>iBackpack Gallery</title>
<style>
  :root {
    --bg: #0c0c0c;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #ececec;
    --muted: #8a8a8a;
    --accent: #bdbdbd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11, 13, 16, 0.85);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .live {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 12px 40px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 720px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 18px; }
  }
  .card {
    background: var(--surface);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: fadein 0.28s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    aspect-ratio: 4/3;
    object-fit: cover;
    filter: grayscale(1);
  }
  .body { padding: 18px 20px 20px; }
  .response {
    font-size: 18px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .ts {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .prompt {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }
  .bytes { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>iBackpack Gallery</h1>
  <div class="meta">
    <span class="bytes" id="storage">—</span>
    <span class="live" id="status">connecting</span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No entries yet. Send an image to Claude to get started.</div>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = params.get("key") || "";

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var storageEl = document.getElementById("storage");
  var seen = new Set();

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
    return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
  }

  function fmtTime(ms) {
    var d = new Date(ms);
    return d.toLocaleString();
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderCard(e) {
    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = e.id;
    var imgUrl = "/admin/gallery/image/" + encodeURIComponent(e.image_filename) +
      "?key=" + encodeURIComponent(key);
    card.innerHTML =
      '<img loading="lazy" src="' + imgUrl + '" alt="" />' +
      '<div class="body">' +
        '<div class="response">' + esc(e.response_text) + "</div>" +
        '<div class="ts">' + esc(fmtTime(e.created_at)) + "</div>" +
      "</div>";
    return card;
  }

  function addEntry(e, prepend) {
    if (seen.has(e.id)) return;
    seen.add(e.id);
    var card = renderCard(e);
    if (prepend) {
      grid.insertBefore(card, grid.firstChild);
    } else {
      grid.appendChild(card);
    }
    updateEmpty();
  }

  function removeEntry(id) {
    var el = grid.querySelector('[data-id="' + id + '"]');
    if (el) el.remove();
    seen.delete(id);
    updateEmpty();
  }

  function updateEmpty() {
    empty.hidden = seen.size > 0;
  }

  function updateStorage(total, max) {
    storageEl.textContent = fmtBytes(total) + " / " + fmtBytes(max);
  }

  function setStatus(s) {
    statusEl.textContent = s;
  }

  function load() {
    fetch("/admin/gallery/api/entries?key=" + encodeURIComponent(key))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        (data.entries || []).forEach(function (e) { addEntry(e, false); });
        updateStorage(data.total_bytes, data.max_bytes);
      })
      .catch(function (err) {
        setStatus("load failed");
        console.error(err);
      });
  }

  function connect() {
    var es = new EventSource("/admin/gallery/events?key=" + encodeURIComponent(key));
    es.addEventListener("open", function () { setStatus("live"); });
    es.addEventListener("error", function () { setStatus("reconnecting"); });
    es.addEventListener("add", function (ev) {
      try {
        var data = JSON.parse(ev.data);
        addEntry(data.entry, true);
        updateStorage(data.total_bytes, data.max_bytes);
      } catch (e) { console.error(e); }
    });
    es.addEventListener("evict", function (ev) {
      try {
        var data = JSON.parse(ev.data);
        removeEntry(data.id);
        updateStorage(data.total_bytes, data.max_bytes);
      } catch (e) { console.error(e); }
    });
    es.addEventListener("ping", function () {});
  }

  load();
  connect();
})();
</script>
</body>
</html>
